<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbacoa Garza - Síguenos y Haz tu Pedido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #2A1810;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(59, 36, 25, 0.95);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 2px solid rgba(212, 133, 63, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .fondo-img {
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            border: 3px solid rgba(212, 133, 63, 0.4);
        }
        
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 20px 25px;
            margin: 18px 0;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }
        
        .social-link:hover::before {
            left: 100%;
        }
        
        .social-link:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        
        .facebook {
            background: linear-gradient(135deg, #1877F2 0%, #0866DC 100%);
            color: white;
        }
        
        .facebook:hover {
            border: 2px solid #4267B2;
            box-shadow: 0 12px 30px rgba(24, 119, 242, 0.5);
        }
        
        .whatsapp {
            background: linear-gradient(135deg, #25D366 0%, #20B058 100%);
            color: white;
        }
        
        .whatsapp:hover {
            border: 2px solid #128C7E;
            box-shadow: 0 12px 30px rgba(37, 211, 102, 0.5);
        }

        .footer {
            margin-top: 25px;
            color: #D4853F;
            font-size: 16px;
            line-height: 1.6;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: #B8A08A;
            font-size: 14px;
            margin-top: 8px;
            font-style: italic;
        }

        /* Iconos SVG elegantes */
        .icon {
            width: 26px;
            height: 26px;
            fill: currentColor;
            flex-shrink: 0;
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.3));
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            
            .social-link {
                font-size: 17px;
                padding: 18px 20px;
            }
            
            .fondo-img {
                max-width: 320px;
            }
        }
    </style>
</head>
