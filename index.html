<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbacoa Garza - Síguenos y Contáctanos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #2A1810;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: #3B2419;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            border: 2px solid rgba(212, 133, 63, 0.2);
        }
        
        .poster-img {
            width: 100%;
            max-width: 350px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 18px 25px;
            margin: 15px 0;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .social-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        .facebook {
            background: linear-gradient(135deg, #1877F2 0%, #0866DC 100%);
            color: white;
            border: 2px solid #1877F2;
        }
        
        .whatsapp {
            background: linear-gradient(135deg, #25D366 0%, #20B058 100%);
            color: white;
            border: 2px solid #25D366;
        }

        .footer {
            margin-top: 20px;
            color: #B8A08A;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            .social-link {
                font-size: 16px;
                padding: 16px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Usar directamente la imagen del póster -->
        <img src="./REDES.png" alt="Barbacoa Garza - Póster Oficial" class="poster-img" />
        
        <a href="https://www.facebook.com/share/1FnHb67j9p/?mibextid=wwXIfr" class="social-link facebook" target="_blank">
            <span style="font-size: 26px;">📘</span>
            <span>Ir a Facebook</span>
        </a>
        
        <a href="https://wa.me/528342521648" class="social-link whatsapp" target="_blank">
            <span style="font-size: 26px;">💬</span>
            <span>Enviar WhatsApp</span>
        </a>
        
        <div class="footer">
            <strong>¡Escanea el QR del póster o usa estos enlaces!</strong>
        </div>
    </div>
</body>
</html>
